<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Habit Tracker & Planner</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F4F7F4;
      --card-bg: #FFFFFF;
      --accent: #769FCD;
      --accent-soft: #EAF2F8;
      --text-main: #2D3748;
      --text-muted: #718096;
      --border: #E2E8F0;
    }

    [data-theme="pink"] {
      --bg-main: #FAF4F5;
      --card-bg: #FFFFFF;
      --accent: #E5989B;
      --accent-soft: #F9ECEC;
      --text-main: #4A3E3D;
      --text-muted: #8C7A79;
      --border: #F0E1E1;
    }

    [data-theme="lavender"] {
      --bg-main: #F8F6FA;
      --card-bg: #FFFFFF;
      --accent: #B5A0D0;
      --accent-soft: #F0ECF6;
      --text-main: #3C354A;
      --text-muted: #7A728A;
      --border: #E6E0F0;
    }

    [data-theme="beige"] {
      --bg-main: #FBF8F3;
      --card-bg: #FFFFFF;
      --accent: #D4A373;
      --accent-soft: #F7EFE5;
      --text-main: #4A3F35;
      --text-muted: #8C7C6D;
      --border: #ECE3D5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding: 16px 12px; transition: all 0.3s ease; }
    .container { max-width: 600px; margin: 0 auto; }

    /* HEADER & TEMA */
    .header { text-align: center; margin-bottom: 20px; }
    .title { font-family: 'Caveat', cursive; font-size: 2.5rem; color: var(--accent); }
    .theme-picker { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
    .theme-btn { border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; cursor: pointer; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); }
    
    /* NAV TAB SCHEDULE */
    .tabs { display: flex; gap: 6px; background: var(--card-bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
    .tab-btn { flex: 1; border: none; background: transparent; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--accent-soft); color: var(--accent); }

    /* CARD STYLING */
    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* INPUT & HABIT LIST */
    .input-group { display: flex; gap: 8px; margin-bottom: 12px; }
    .text-input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; background: var(--bg-main); font-size: 0.85rem; color: var(--text-main); }
    .btn-add { background: var(--accent); color: white; border: none; padding: 0 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    
    .habit-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); }
    .habit-left { display: flex; align-items: center; gap: 8px; }
    .completed { text-decoration: line-through; color: var(--text-muted); }
    
    /* PROGRESS BAR */
    .progress-outer { background: var(--accent-soft); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .progress-inner { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }

    /* GRID & TEXTAREA */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--bg-main); outline: none; font-size: 0.85rem; color: var(--text-main); resize: none; }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <h1 class="title">✨ My Aesthetic Planner</h1>
    <div class="theme-picker">
      <button class="theme-btn" onclick="setTheme('sage')">🌿 Sage</button>
      <button class="theme-btn" onclick="setTheme('pink')">🌷 Pink</button>
      <button class="theme-btn" onclick="setTheme('lavender')">🍇 Lavender</button>
      <button class="theme-btn" onclick="setTheme('beige')">☕ Beige</button>
    </div>
  </div>

  <!-- TABS JADWAL -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('harian')">Harian</button>
    <button class="tab-btn" onclick="switchTab('mingguan')">Mingguan</button>
    <button class="tab-btn" onclick="switchTab('bulanan')">Bulanan</button>
  </div>

  <!-- TAB HARIAN -->
  <div id="tab-harian" class="tab-content active">
    
    <!-- PROGRESS TRACKER -->
    <div class="card">
      <div class="card-title">
        <span>📊 Target Hari Ini</span>
        <span id="prog-percent" style="color: var(--accent);">0%</span>
      </div>
      <div class="progress-outer">
        <div class="progress-inner" id="prog-bar"></div>
      </div>
    </div>

    <!-- HABIT CHECKLIST -->
    <div class="card">
      <div class="card-title">📝 Habit Checklist</div>
      <div class="input-group">
        <input type="text" id="habit-input" class="text-input" placeholder="Tambah kebiasaan baru...">
        <button class="btn-add" onclick="addHabit()">+</button>
      </div>
      <div id="habit-list"></div>
    </div>

    <!-- TRACKER TIDUR & KEUANGAN -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">🌙 Sleep Tracker</div>
        <input type="time" id="sleep-time" class="text-input" style="margin-bottom:6px;" onchange="saveData()">
        <input type="time" id="wake-time" class="text-input" onchange="saveData()">
      </div>
      <div class="card">
        <div class="card-title">💰 Keuangan</div>
        <input type="number" id="income" class="text-input" placeholder="Masuk (Rp)" style="margin-bottom:6px;" oninput="calcFinance()">
        <input type="number" id="expense" class="text-input" placeholder="Keluar (Rp)" oninput="calcFinance()">
        <div style="font-size: 0.75rem; margin-top: 6px; font-weight: 600;">Sisa: <span id="balance" style="color:var(--accent)">Rp 0</span></div>
      </div>
    </div>

    <!-- REFLEKSI HARIAN -->
    <div class="card">
      <div class="card-title">💡 Catatan Hari Ini</div>
      <textarea id="notes" rows="3" placeholder="Tulis cerita atau evaluasi hari ini..." oninput="saveData()"></textarea>
    </div>

  </div>

  <!-- TAB MINGGUAN -->
  <div id="tab-mingguan" class="tab-content">
    <div class="card">
      <div class="card-title">🗓️ Target Mingguan</div>
      <textarea id="weekly-plan" rows="6" placeholder="Senin: ...&#10;Selasa: ...&#10;Rabu: ..." oninput="saveData()"></textarea>
    </div>
  </div>

  <!-- TAB BULANAN -->
  <div id="tab-bulanan" class="tab-content">
    <div class="card">
      <div class="card-title">📌 Monthly Goals</div>
      <textarea id="monthly-plan" rows="6" placeholder="Fokus utama bulan ini..." oninput="saveData()"></textarea>
    </div>
  </div>

</div>

<script>
  let habits = JSON.parse(localStorage.getItem('my_habits_v2')) || [];

  window.onload = function() {
    renderHabits();
    loadData();
    const savedTheme = localStorage.getItem('my_theme_v2');
    if(savedTheme) setTheme(savedTheme);
  };

  function setTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('my_theme_v2', theme);
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tabName}`).classList.add('active');
  }

  function addHabit() {
    const input = document.getElementById('habit-input');
    if (!input.value.trim()) return;
    habits.push({ id: Date.now(), text: input.value, done: false });
    input.value = '';
    renderHabits();
    saveData();
  }

  function toggleHabit(id) {
    const h = habits.find(x => x.id === id);
    if(h) h.done = !h.done;
    renderHabits();
    saveData();
  }

  function deleteHabit(id) {
    habits = habits.filter(x => x.id !== id);
    renderHabits();
    saveData();
  }

  function renderHabits() {
    const list = document.getElementById('habit-list');
    list.innerHTML = '';
    habits.forEach(h => {
      list.innerHTML += `
        <div class="habit-item">
          <div class="habit-left">
            <input type="checkbox" ${h.done ? 'checked' : ''} onchange="toggleHabit(${h.id})">
            <span class="${h.done ? 'completed' : ''}">${h.text}</span>
          </div>
          <button style="border:none; background:transparent; cursor:pointer;" onclick="deleteHabit(${h.id})">❌</button>
        </div>
      `;
    });
    updateProgress();
  }

  function updateProgress() {
    if(habits.length === 0) {
      document.getElementById('prog-bar').style.width = '0%';
      document.getElementById('prog-percent').innerText = '0%';
      return;
    }
    const done = habits.filter(h => h.done).length;
    const pct = Math.round((done / habits.length) * 100);
    document.getElementById('prog-bar').style.width = pct + '%';
    document.getElementById('prog-percent').innerText = pct + '%';
  }

  function calcFinance() {
    const inc = parseFloat(document.getElementById('income').value) || 0;
    const exp = parseFloat(document.getElementById('expense').value) || 0;
    document.getElementById('balance').innerText = `Rp ${(inc - exp).toLocaleString('id-ID')}`;
    saveData();
  }

  function saveData() {
    localStorage.setItem('my_habits_v2', JSON.stringify(habits));
    const data = {
      sleep: document.getElementById('sleep-time').value,
      wake: document.getElementById('wake-time').value,
      income: document.getElementById('income').value,
      expense: document.getElementById('expense').value,
      notes: document.getElementById('notes').value,
      weekly: document.getElementById('weekly-plan').value,
      monthly: document.getElementById('monthly-plan').value
    };
    localStorage.setItem('my_planner_v2', JSON.stringify(data));
  }

  function loadData() {
    const data = JSON.parse(localStorage.getItem('my_planner_v2'));
    if(!data) return;
    document.getElementById('sleep-time').value = data.sleep || '';
    document.getElementById('wake-time').value = data.wake || '';
    document.getElementById('income').value = data.income || '';
    document.getElementById('expense').value = data.expense || '';
    document.getElementById('notes').value = data.notes || '';
    document.getElementById('weekly-plan').value = data.weekly || '';
    document.getElementById('monthly-plan').value = data.monthly || '';
    calcFinance();
  }
</script>
</body>
      </html>
